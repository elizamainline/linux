%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/sgmicro,sgm38120.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SG Micro SGM38120 camera power management IC

maintainers:
  - Oleksii Onchul <oleksiionchul@gmail.com>

description: |
  The SGM38120 provides seven LDO outputs. LDO1 and LDO2 supply digital
  rails, while LDO3 through LDO7 supply analog and interface rails.
  RESET_B is active low and must be deasserted for I2C communication.

properties:
  compatible:
    const: sgmicro,sgm38120

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vin12-supply:
    description: Input supply for LDO1 and LDO2.

  vin34-supply:
    description: Input supply for LDO3 and LDO4.

  vin5-supply:
    description: Input supply for LDO5.

  vin6-supply:
    description: Input supply for LDO6.

  vin7-supply:
    description: Input supply for LDO7.

  regulators:
    type: object
    additionalProperties: false

    patternProperties:
      "^ldo[1-7]$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false

required:
  - compatible
  - reg
  - reset-gpios
  - regulators

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@35 {
            compatible = "sgmicro,sgm38120";
            reg = <0x35>;
            reset-gpios = <&gpio 5 GPIO_ACTIVE_LOW>;
            vin12-supply = <&vreg_s2>;
            vin34-supply = <&vreg_bob>;
            vin7-supply = <&vreg_bob>;

            regulators {
                ldo2 {
                    regulator-name = "camera-dvdd";
                    regulator-min-microvolt = <1200000>;
                    regulator-max-microvolt = <1200000>;
                };
                ldo4 {
                    regulator-name = "camera-dovdd";
                    regulator-min-microvolt = <1800000>;
                    regulator-max-microvolt = <1800000>;
                };
                ldo7 {
                    regulator-name = "camera-avdd";
                    regulator-min-microvolt = <2800000>;
                    regulator-max-microvolt = <2800000>;
                };
            };
        };
    };
