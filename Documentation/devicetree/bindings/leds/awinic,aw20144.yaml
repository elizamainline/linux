%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/awinic,aw20144.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW20144 matrix LED controller

maintainers:
  - Oleksii Onchul <oleksiionchul@gmail.com>

description: |
  The AW20144 drives up to 144 LEDs using 18 current sinks and eight scan
  switches. Each channel has independent 8-bit PWM and scaling registers.
  Channel numbers are zero-based, with 18 consecutive channels per switch.

properties:
  compatible:
    const: awinic,aw20144

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  enable-gpios:
    maxItems: 1
    description: GPIO connected to the active-high EN pin.

  awinic,global-current:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 255
    description: |
      Global current register (GCCR) value. The peak channel current is
      proportional to this value and is also determined by the external
      ISET resistor. This is a dimensionless register setting, not a
      current in microamps. Select a value appropriate for the board's
      resistor and LEDs.

  awinic,pwm-frequency:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [62500, 31250, 15600, 7800, 3900, 1950, 977, 488]
    default: 62500
    description: Nominal PWM clock frequency in Hz, selected for the LED panel.

patternProperties:
  "^led@[0-9a-f]+$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        minimum: 0
        maximum: 143
        description: LED channel number.

      default-state:
        const: "off"

    required:
      - reg

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"
  - enable-gpios
  - awinic,global-current

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@20 {
            compatible = "awinic,aw20144";
            reg = <0x20>;
            #address-cells = <1>;
            #size-cells = <0>;
            enable-gpios = <&gpio 8 GPIO_ACTIVE_HIGH>;
            awinic,global-current = <13>;

            led@0 {
                reg = <0>;
                color = <LED_COLOR_ID_WHITE>;
                function = LED_FUNCTION_INDICATOR;
                function-enumerator = <0>;
                default-state = "off";
            };
        };
    };
