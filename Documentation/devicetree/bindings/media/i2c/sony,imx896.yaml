%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx896.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX896 image sensor

maintainers:
  - Oleksii Onchul <oleksiionchul@gmail.com>

description:
  Sony IMX896 is an 8192 by 6144 pixel image sensor. Initial support uses
  a 19.2 MHz input clock and three-trio MIPI CSI-2 C-PHY, with 2 by 2
  binning to produce 4096 by 3072 RAW10 images.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx896

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  vana1-supply:
    description: 1.8 V analog power supply.

  vana2-supply:
    description: 2.8 V analog power supply.

  vdig-supply:
    description: Digital core power supply.

  vif-supply:
    description: 1.8 V interface power supply.

  reset-gpios:
    description: Reset GPIO, active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            const: 1

          clock-lanes: false

          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3

          link-frequencies:
            items:
              - const: 987789474

        required:
          - bus-type
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - vana1-supply
  - vana2-supply
  - vdig-supply
  - vif-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "sony,imx896";
            reg = <0x10>;
            clocks = <&camera_mclk 1>;
            assigned-clocks = <&camera_mclk 1>;
            assigned-clock-rates = <19200000>;
            reset-gpios = <&gpio 124 GPIO_ACTIVE_LOW>;
            vana1-supply = <&vreg_1p8_analog>;
            vana2-supply = <&vreg_2p8>;
            vdig-supply = <&vreg_core>;
            vif-supply = <&vreg_1p8_io>;

            port {
                endpoint {
                    bus-type = <1>;
                    data-lanes = <1 2 3>;
                    link-frequencies = /bits/ 64 <987789474>;
                    remote-endpoint = <&csiphy1_ep>;
                };
            };
        };
    };
