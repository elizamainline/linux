%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/awinic,aw86016.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW86016CSR Bidirectional Autofocus Controller

maintainers:
  - Oleksii Onchul <oleksiionchul@gmail.com>

description:
  The AW86016CSR is a bidirectional voice coil motor driver with a 10-bit
  DAC and programmable damping, accessed over I2C. Its power supply range
  is 2.3 to 3.6 volts. Factory configuration is stored in on-chip eNVM.

properties:
  compatible:
    const: awinic,aw86016

  reg:
    maxItems: 1

  vdd-supply:
    description: Motor and controller power supply.

  vio-supply:
    description: Supply for the shared camera module I2C interface and pull-ups.

required:
  - compatible
  - reg
  - vdd-supply
  - vio-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        lens@c {
            compatible = "awinic,aw86016";
            reg = <0x0c>;
            vdd-supply = <&cam_af>;
            vio-supply = <&cam_io>;
        };
    };
