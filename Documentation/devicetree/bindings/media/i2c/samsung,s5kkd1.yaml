%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5kkd1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5KKD1 image sensor

maintainers:
  - Oleksii Onchul <oleksiionchul@gmail.com>

description:
  The S5KKD1 is a 32-megapixel image sensor controlled over I2C. The
  supported 3280x2464 RAW10 mode uses four CSI-2 D-PHY data lanes and
  a 19.2 MHz master clock.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5kkd1

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  reset-gpios:
    description: Active-low reset input.
    maxItems: 1

  vddio-supply:
    description: Digital I/O supply, 1.8 V.

  vddd-supply:
    description: Digital core supply, 1.05 V.

  vdda-supply:
    description: Analog supply, 2.8 V.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false
        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4
          link-frequencies:
            items:
              - const: 638700000
        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - vddio-supply
  - vddd-supply
  - vdda-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@3d {
            compatible = "samsung,s5kkd1";
            reg = <0x3d>;
            clocks = <&cam_mclk 3>;
            assigned-clocks = <&cam_mclk 3>;
            assigned-clock-rates = <19200000>;
            reset-gpios = <&gpio 126 GPIO_ACTIVE_LOW>;
            vddio-supply = <&vreg_io>;
            vddd-supply = <&vreg_digital>;
            vdda-supply = <&vreg_analog>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <638700000>;
                    remote-endpoint = <&csiphy3_ep>;
                };
            };
        };
    };
