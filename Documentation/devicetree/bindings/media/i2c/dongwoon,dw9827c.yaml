%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/dongwoon,dw9827c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dongwoon DW9827C Closed-loop Autofocus Controller

maintainers:
  - Oleksii Onchul <oleksiionchul@gmail.com>

description:
  The DW9827C controls an autofocus motor using an internal Hall sensor and
  PID controller. Factory calibration is stored in on-chip nonvolatile
  memory. The controller is accessed over I2C and uses a 2.65 to 3.6 volt
  supply. This driver exposes 12-bit lens positions.

properties:
  compatible:
    const: dongwoon,dw9827c

  reg:
    maxItems: 1

  vdd-supply:
    description: Motor and controller power supply.

  vio-supply:
    description: Supply for the camera module I2C interface.

required:
  - compatible
  - reg
  - vdd-supply
  - vio-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        lens@f {
            compatible = "dongwoon,dw9827c";
            reg = <0x0f>;
            vdd-supply = <&cam_af>;
            vio-supply = <&cam_io>;
        };
    };
