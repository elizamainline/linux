%YAML 1.2
---
$id: http://devicetree.org/schemas/input/ics,rt6010.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ICSense RT6010 LRA haptic controller

maintainers:
  - Oleksii Onchul <oleksiionchul@gmail.com>

properties:
  compatible:
    const: ics,rt6010

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        vibrator@5f {
            compatible = "ics,rt6010";
            reg = <0x5f>;
            reset-gpios = <&tlmm 30 GPIO_ACTIVE_LOW>;
            interrupts-extended = <&tlmm 116 IRQ_TYPE_LEVEL_LOW>;
        };
    };
